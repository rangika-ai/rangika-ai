name: Research Lab preview
on:
  push:
    branches: [osd-fractal-levels-preview]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original standalone Research Lab
        shell: bash
        run: |
          mkdir -p original
          curl --fail --location --retry 2 --max-time 60 'https://researchlab-ar553q7ug-rangikaailapperuma1-2782s-projects.vercel.app/' --output original/index.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('original/index.html').read_text()
          assert 'priceChart' in text and 'currentIndex' in text, 'Original Research Lab was not returned.'
          print('Original application bytes:',len(text.encode()))
          PY
      - name: Build patched application when patch is available
        shell: bash
        run: |
          if [ -f build.mjs ]; then node build.mjs; fi
      - uses: actions/upload-artifact@v4
        with:
          name: research-lab-source
          path: |
            original/
            public/
          retention-days: 7
